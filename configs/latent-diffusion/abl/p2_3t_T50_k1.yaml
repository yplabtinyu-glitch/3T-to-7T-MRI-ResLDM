model:
  base_learning_rate: 1.0e-05
  target: ldm.models.diffusion.resshift.LatentResShift
  params:
    resshift_T: 50
    resshift_p: 0.3
    resshift_kappa:
    - 0.828
    - 0.421
    - 0.466
    - 0.799
    condition_select: 3t
    linear_start: 0.0015
    linear_end: 0.0195
    scale_factor: 0.987
    scale_by_std: false
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 15
    first_stage_key: image
    cond_stage_key: image
    image_size: 16
    channels: 4
    cond_stage_trainable: false
    conditioning_key: hybrid
    monitor: val/loss_simple_ema
    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        dims: 2
        num_classes: 2
        image_size: 16
        in_channels: 8
        out_channels: 4
        model_channels: 128
        attention_resolutions:
        - 4
        - 2
        num_res_blocks: 1
        channel_mult:
        - 1
        - 1
        - 2
        num_head_channels: 32
        transformer_depth: 1
        use_spatial_transformer: false
    first_stage_config:
      target: ldm.models.frozen_ae_spade.FrozenAEWithSPADE
      params:
        ae_checkpoint_path: ~/Desktop/LSC/checkpoints_ae/ae_epoch690.pth
        num_classes: 2
        spade_checkpoint_path: /home/ubuntu/Desktop/LSC/checkpoints_spade_mind/spade_epoch19.pth
    cond_stage_config: __is_unconditional__
    y0_source: spade
